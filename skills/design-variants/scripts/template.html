<title>{{Board title, two to four words}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="{{Google Fonts URL for the product's family and the weights it ships}}"
/>
<style>
  /* Review board for {{what is being redesigned}}. Tokens copied from {{token source file}}. */
  :root{
    color-scheme: light; /* the product's theme; add a dark block if the product has one */
    --background: {{}}; --foreground: {{}}; --muted-foreground: {{}};
    --primary: {{}}; --primary-foreground: {{}};
    --accent: {{}}; --card: {{}}; --border: {{}};
    --radius: {{}};
    --font: {{"Product Font"}}, system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font)}
  button{font:inherit;color:inherit}
  a{color:inherit}
  img{max-width:100%;display:block}
  a:focus-visible,button:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
  .board{max-width:1180px;margin-inline:auto;padding:28px 16px 80px;display:grid;gap:48px}
  .intro{display:grid;gap:8px;max-width:800px}
  .intro h1{margin:0;font-size:2rem;line-height:1.15;text-wrap:balance}
  .intro p{margin:0;color:var(--muted-foreground);font-size:1.05rem;line-height:1.6}
  .variant{display:grid;gap:12px}
  .variant-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
  .variant-num{background:var(--foreground);color:var(--background);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.9rem}
  .variant-name{font-weight:700;font-size:1.35rem}
  .variant-why{color:var(--muted-foreground)}
  .frame{border-radius:calc(var(--radius) * 2);overflow:hidden;box-shadow:0 18px 40px -26px rgb(0 0 0 / .45)}

  /* Variant 1: {{name}} */
  .v1{padding:40px}
  @media (max-width:820px){.v1{padding:24px 16px}}
</style>

<div class="board" dir="{{ltr|rtl}}" lang="{{lang}}">
  <header class="intro">
    <h1>{{What is being redesigned}}: {{n}} directions</h1>
    <p>
      {{One line: what is real here, and that nothing is sent from this page.}}
    </p>
  </header>

  <section class="variant" data-variant="1" aria-label="{{Variant 1}}">
    <div class="variant-head">
      <span class="variant-num">1</span>
      <span class="variant-name">{{Short name}}</span>
      <span class="variant-why"
        >{{One line: what this variant optimises for.}}</span
      >
    </div>
    <div class="frame">
      <div class="v1">
        {{The variant, built from the product's tokens, real copy, real data and
        {{asset:name}} images}}
      </div>
    </div>
  </section>

  <!-- Repeat <section class="variant" data-variant="n"> for each variant, 4-5 in all. -->
</div>

<script>
  /* Only for variants whose idea is an interaction. Real data goes in a const, and forms call preventDefault. */
</script>
